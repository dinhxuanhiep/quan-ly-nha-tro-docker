version: '3.8'

services:
  # 1. Container Web Server (Nginx)
  web:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./src:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  # 2. Container Mã nguồn (PHP)
  app:
    build:
      context: ./php
    volumes:
      - ./src:/var/www/html
    depends_on:
      - db

  # 3. Container Cơ sở dữ liệu (MySQL)
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: nhatro_db
      MYSQL_USER: admin
      MYSQL_PASSWORD: password123
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      - ./mysql:/docker-entrypoint-initdb.d
